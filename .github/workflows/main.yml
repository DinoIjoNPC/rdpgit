
name: RDP

on:
  workflow_dispatch:
    inputs:
      part:
        description: 'Sesi'
        default: '1'
      msg:
        description: 'ID pesan Telegram'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 358
    defaults:
      run:
        shell: pwsh
    env:
      TS_KEY: ${{ secrets.TS_KEY }}
      PASS: ${{ secrets.PASS }}
      BOT: ${{ secrets.BOT }}
      CHAT: ${{ secrets.CHAT }}
      GH_TOKEN: ${{ github.token }}
      PART: ${{ github.event.inputs.part }}
      MSGID: ${{ github.event.inputs.msg }}
      RUNURL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
    - name: 1 Siapkan sistem
      run: |
        $h = @'
        $S = @('Siapkan sistem','Aktifkan RDP','Buat user','Pasang Tailscale','Konek Tailscale')

        function Esc($s){ ("$s" -replace '&','&amp;' -replace '<','&lt;' -replace '>','&gt;') }

        function Tg($t,$kb){
          if (-not $env:BOT -or -not $env:CHAT) { return }
          $b = @{ chat_id=$env:CHAT; text=$t; parse_mode='HTML'; disable_web_page_preview='true' }
          if ($kb) { $b.reply_markup = ($kb | ConvertTo-Json -Depth 6 -Compress) }
          $api = "https://api.telegram.org/bot$($env:BOT)"
          try {
            if ($env:MSGID) {
              $b.message_id = $env:MSGID
              Invoke-RestMethod -Method Post -Uri "$api/editMessageText" -Body $b | Out-Null
            } else {
              $r = Invoke-RestMethod -Method Post -Uri "$api/sendMessage" -Body $b
              $env:MSGID = "$($r.result.message_id)"
              "MSGID=$($env:MSGID)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          } catch { Write-Host "Telegram notification unavailable." }
        }

        function Note($t){
          if (-not $env:BOT -or -not $env:CHAT) { return }
          try {
            Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$($env:BOT)/sendMessage" -Body @{ chat_id=$env:CHAT; text=$t; parse_mode='HTML' } | Out-Null
          } catch {}
        }

        function Panel($n,$note){
          $l = for($i=0;$i -lt $S.Count;$i++){
            if($i -lt $n){ "✅ $($S[$i])" }
            elseif($i -eq $n){ "🔄 <b>$($S[$i])</b>..." }
            else { "▱ $($S[$i])" }
          }
          $bar = ('▰'*$n) + ('▱'*($S.Count-$n))
          $pct = [int]($n*100/$S.Count)
          Tg ("<b>DINO RDP</b> · <code>INITIALIZING</code>`n`n" + ($l -join "`n") + "`n`n$bar  $pct%`n$note`n━━━━━━━━━━━━━━━━━━")
        }

        function Why($e){
          if ($e -match 'PASS_SECRET_MISSING') {
            return @('Secret <code>PASS</code> belum dibuat atau kosong.','Buka Repo → Settings → Secrets and variables → Actions. Buat secret bernama <code>PASS</code>, lalu jalankan /run lagi.')
          }
          if ($e -match 'PASS_POLICY_INVALID') {
            return @('Password tidak memenuhi syarat.','Gunakan password minimal 8 dan maksimal 128 karakter. Tidak wajib kombinasi huruf besar, huruf kecil, angka, atau simbol. Simpan di secret <code>PASS</code>.')
          }
          if ($e -match 'TS_KEY_KOSONG') {
            return @('Secret <code>TS_KEY</code> kosong atau belum dibuat.','Repo → Settings → Secrets and variables → Actions → buat <code>TS_KEY</code> isi auth key Tailscale.')
          }
          if ($e -match 'TS_NO_IP') {
            return @('Tailscale tersambung tapi tidak mendapat IP.','Cek Tailscale Admin Console dan batas device.')
          }
          if ($e -match 'invalid|expired|unauthorized|auth ?key|not valid|401') {
            return @('Auth key Tailscale ditolak.','Buat key baru di Tailscale Admin → Settings → Keys. Update secret <code>TS_KEY</code>.')
          }
          if ($e -match 'password|complex|policy') {
            return @('Password ditolak aturan Windows.','Periksa secret <code>PASS</code> dan persyaratan password.')
          }
          if ($e -match 'resolved|timed out|unable to connect|ssl|remote server|download|msiexec') {
            return @('Runner gagal mengunduh atau menghubungi server.','Coba /run lagi dan periksa log Actions.')
          }
          if ($e -match 'netsh|firewall') {
            return @('Gagal mengatur firewall RDP.','Periksa log Actions.')
          }
          return @('Error yang tidak dikenali.','Buka link log Actions untuk pemeriksaan lebih lanjut.')
        }

        function Fail($stage,$err){
          "x" | Out-File "$env:RUNNER_TEMP\failed.flag"
          $w = Why "$err"
          $raw = "$err"
          foreach ($secret in @($env:PASS,$env:TS_KEY,$env:BOT)) {
            if (-not [string]::IsNullOrEmpty($secret)) {
              $raw = $raw.Replace($secret,'[REDACTED]')
            }
          }
          $raw = Esc $raw.Trim()
          if ($raw.Length -gt 300) { $raw = $raw.Substring(0,300) }
          Tg ("❌ <b>GAGAL</b> di tahap <b>$($S[$stage])</b>`n`n🔍 <b>Penyebab:</b>`n$($w[0])`n`n🛠️ <b>Solusi:</b>`n$($w[1])`n`n📋 <b>Error:</b>`n<pre>$raw</pre>`n`n🔗 $($env:RUNURL)")
          exit 1
        }

        function Ready($m){
          $sisa = 350 - $m
          $f = [math]::Min(10,[int]($m/35))
          $bar = ('▰'*$f) + ('▱'*(10-$f))

          $row1 = @(
            @{ text='📋 Salin IP'; copy_text=@{ text="$($env:IP)" } },
            @{ text='📋 Salin User'; copy_text=@{ text='Skyro' } }
          )
          $row2 = @(
            @{ text='📋 Salin CMD'; copy_text=@{ text="mstsc /v:$($env:IP)" } }
          )
          $kb = @{ inline_keyboard = @($row1, $row2) }

          Tg ("<b>DINO RDP</b> <code>SESSION ONLINE</code> · part $($env:PART)/2`n━━━━━━━━━━━━━━━━━━`n🌐 IP : <code>$($env:IP)</code>`n👤 User : <code>Skyro</code>`n🔐 Password: <i>tidak ditampilkan melalui notifikasi</i>`n💻 CMD : <code>mstsc /v:$($env:IP)</code>`n━━━━━━━━━━━━━━━━━━`n🟢 Online`n⏱️ $bar ${m}m / 350m`n⌛ Sisa ±${sisa}m`n`n👇 <i>Gunakan tombol untuk menyalin</i>") $kb
        }
        '@

        Set-Content "$env:RUNNER_TEMP\tg.ps1" $h -Encoding utf8
        . "$env:RUNNER_TEMP\tg.ps1"
        $ErrorActionPreference = 'Stop'

        Panel 0 "⚙️ Memvalidasi konfigurasi..."

        if ([string]::IsNullOrWhiteSpace($env:PASS)) {
          Fail 0 'PASS_SECRET_MISSING'
        }

        # Password: 8–128 karakter, tanpa syarat komposisi.
        if ($env:PASS.Length -lt 8 -or
            $env:PASS.Length -gt 128) {
          Fail 0 'PASS_POLICY_INVALID'
        }

        try {
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          Stop-Service wuauserv -Force -ErrorAction SilentlyContinue
          Set-Service wuauserv -StartupType Disabled -ErrorAction SilentlyContinue
        } catch { Fail 0 $_ }

    - name: 2 Aktifkan RDP
      run: |
        . "$env:RUNNER_TEMP\tg.ps1"
        $ErrorActionPreference = 'Stop'
        Panel 1 "🔓 Membuka port 3389..."
        try {
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10
          if ($LASTEXITCODE -ne 0) { throw "netsh firewall gagal (kode $LASTEXITCODE)" }
          Restart-Service TermService -Force
        } catch { Fail 1 $_ }

    - name: 3 Buat user
      run: |
        . "$env:RUNNER_TEMP\tg.ps1"
        $ErrorActionPreference = 'Stop'
        Panel 2 "👤 Membuat user Skyro..."
        try {
          $s = ConvertTo-SecureString $env:PASS -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $s -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"
        } catch { Fail 2 $_ }

    - name: 4 Pasang Tailscale
      run: |
        . "$env:RUNNER_TEMP\tg.ps1"
        $ErrorActionPreference = 'Stop'
        Panel 3 "📥 Mengunduh Tailscale..."
        try {
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-1.104.7-amd64.msi" -OutFile ts.msi -UseBasicParsing
          $pr = Start-Process msiexec.exe -ArgumentList '/i ts.msi /quiet /norestart' -Wait -PassThru
          if ($pr.ExitCode -ne 0) { throw "msiexec gagal (kode $($pr.ExitCode))" }
          if (-not (Test-Path "C:\Program Files\Tailscale\tailscale.exe")) {
            throw "tailscale.exe tidak ditemukan"
          }
        } catch { Fail 3 $_ }

    - name: 5 Konek Tailscale
      run: |
        . "$env:RUNNER_TEMP\tg.ps1"
        $ErrorActionPreference = 'Stop'
        Panel 4 "🌐 Menyambung ke jaringan..."
        try {
          if (-not $env:TS_KEY) { throw 'TS_KEY_KOSONG' }
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $out = & $ts up --authkey=$env:TS_KEY --hostname="rdp-$env:PART" --advertise-tags=tag:rdp 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw $out }

          $ip = ""
          $i = 0
          while (-not $ip -and $i -lt 15) {
            Start-Sleep 3
            $ip = (& $ts ip -4 2>$null | Out-String).Trim()
            $i++
          }
          if (-not $ip) { throw 'TS_NO_IP' }
          "IP=$ip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        } catch { Fail 4 $_ }

    - name: 6 Online + Keepalive
      run: |
        . "$env:RUNNER_TEMP\tg.ps1"
        $ts = "C:\Program Files\Tailscale\tailscale.exe"
        Ready 0

        if ($env:BOT -and $env:CHAT -and $env:MSGID) {
          try {
            Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$($env:BOT)/pinChatMessage" -Body @{
              chat_id=$env:CHAT
              message_id=$env:MSGID
              disable_notification='true'
            } | Out-Null
          } catch {}
        }

        $start = Get-Date
        $last = 0
        $handed = $false

        while ($true) {
          $m = [int]((Get-Date) - $start).TotalMinutes
          if ($m -ge 350) { break }

          if ($env:PART -eq '1' -and -not $handed -and $m -ge 340) {
            $handed = $true
            try {
              $body = @{
                ref = '${{ github.ref_name }}'
                inputs = @{ part = '2'; msg = '' }
              } | ConvertTo-Json

              Invoke-RestMethod -Method Post `
                -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches" `
                -Headers @{
                  Authorization = "Bearer $env:GH_TOKEN"
                  Accept = 'application/vnd.github+json'
                } `
                -Body $body -ContentType 'application/json'

              Note "🔁 <b>Sesi 1 hampir habis</b>`n▶️ Sesi 2 dimulai otomatis."
            } catch {
              Note "⚠️ <b>Gagal memulai sesi 2 otomatis.</b> Jalankan /run secara manual."
            }
          }

          $st = (& $ts status --json 2>$null | ConvertFrom-Json).BackendState
          if ($st -ne 'Running') {
            & $ts up --authkey=$env:TS_KEY --hostname="rdp-$env:PART" --advertise-tags=tag:rdp 2>&1 | Out-Null
          }

          if ($m -ge $last + 5) {
            Ready $m
            $last = $m
          }

          Write-Host "[$m m] sesi aktif."
          Start-Sleep 60
        }

    - name: Laporan akhir
      if: always()
      run: |
        if (-not (Test-Path "$env:RUNNER_TEMP\tg.ps1")) { exit 0 }
        . "$env:RUNNER_TEMP\tg.ps1"

        if ($env:BOT -and $env:CHAT -and $env:MSGID) {
          try {
            Invoke-RestMethod -Method Post -Uri "https://api.telegram.org/bot$($env:BOT)/unpinChatMessage" -Body @{
              chat_id=$env:CHAT
              message_id=$env:MSGID
            } | Out-Null
          } catch {}
        }

        if (Test-Path "$env:RUNNER_TEMP\failed.flag") { exit 0 }

        switch ("${{ job.status }}") {
          'success' {
            Tg "🏁 <b>Sesi $($env:PART) selesai</b>`n⏰ Waktu habis, RDP dimatikan."
          }
          'cancelled' {
            Tg "🛑 <b>Dihentikan</b>`nRDP dimatikan."
          }
          default {
            Tg "❌ <b>Workflow berhenti tak terduga</b>`n🔍 Periksa log Actions.`n🔗 $($env:RUNURL)"
          }
        }
